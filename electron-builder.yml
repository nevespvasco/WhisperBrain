appId: com.whisperbrain.app
productName: WhisperBrain
copyright: Copyright © WhisperBrain contributors
directories:
  output: dist
  buildResources: build
files:
  - electron/**
  - src/**
  - ui/**
  - package.json
  - "!**/*.md"
  - "!**/test/**"
# Native speech engine (sherpa-onnx .node + shared libs) cannot run from inside the asar archive.
asarUnpack:
  - "**/node_modules/sherpa-onnx-*/**"
  # Discord calls are end-to-end encrypted (DAVE); the bot decrypts them with a native module
  - "**/node_modules/@snazzah/davey-*/**"
  - "**/node_modules/sqlite-vec-*/**"   # the native extension must be a real file on disk to be loaded
  # the owned speaker pipeline runs the segmentation model with onnxruntime-node (a .node binding that loads libonnxruntime beside it)
  - "**/node_modules/onnxruntime-node/**"
extraResources:
  - from: resources
    to: resources
  - from: build/icon.png
    to: build/icon.png
  # the browser extension for Google Meet: the person loads this folder into their browser ("Load unpacked")
  - from: extension/meet
    to: extension/meet
linux:
  # a platform's own `files` replaces the list above, so it repeats it; the extra line leaves out the onnxruntime binaries of the other systems
  files:
    - electron/**
    - src/**
    - ui/**
    - package.json
    - "!**/*.md"
    - "!**/test/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,win32}/**"
  target: [AppImage, deb]
  category: Office
  icon: build/icon.png
  synopsis: Local-first AI notepad for meetings
  maintainer: WhisperBrain contributors <noreply@whisperbrain.invalid>
  # No executableArgs here: under linux: they reach every target, and the .deb must keep the OS sandbox (its installer makes
  # chrome-sandbox setuid or installs an AppArmor profile where user namespaces are restricted). See appImage below.
  extraResources:
    - from: build/x11/whisperbrain-x11
      to: bin/whisperbrain-x11
    - from: build/atspi/whisperbrain-atspi
      to: bin/whisperbrain-atspi
# The AppImage cannot ship a setuid chrome-sandbox. Its launcher (AppRun) adds --no-sandbox by itself only when unprivileged user
# namespaces do not work (unshare -Ur true fails, e.g. Ubuntu 24.04's AppArmor restriction); the empty list stops electron-builder
# from forcing the flag in the AppImage's desktop entry. docs/packaging.md §3.
appImage:
  executableArgs: []
deb:
  depends: [libpipewire-0.3-0, pipewire-bin, xclip, libx11-6, libxtst6, libxi6, libatspi2.0-0]
  recommends: [wl-clipboard, wtype]
mac:
  # a platform's own `files` replaces the list above, so it repeats it; the extra line leaves out the onnxruntime binaries of the other systems
  files:
    - electron/**
    - src/**
    - ui/**
    - package.json
    - "!**/*.md"
    - "!**/test/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{linux,win32}/**"
  target: [dmg, zip]
  category: public.app-category.productivity
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: build/ax/whisperbrain-ax
      to: bin/whisperbrain-ax
    - from: build/tap/whisperbrain-tap
      to: bin/whisperbrain-tap
  extendInfo:
    NSMicrophoneUsageDescription: WhisperBrain records your microphone to transcribe your meetings on this device.
    NSAudioCaptureUsageDescription: WhisperBrain captures system audio to transcribe the other side of your calls on this device.
    NSScreenCaptureUsageDescription: WhisperBrain needs screen recording access to capture system audio, and to read a question on your screen when you ask the meeting assistant to.
    NSAppleEventsUsageDescription: WhisperBrain pastes dictated text into the focused app.
    NSAccessibilityUsageDescription: WhisperBrain reads who is speaking in the meeting window of your browser, to name the voices on the call.
win:
  # a platform's own `files` replaces the list above, so it repeats it; the extra line leaves out the onnxruntime binaries of the other systems
  files:
    - electron/**
    - src/**
    - ui/**
    - package.json
    - "!**/*.md"
    - "!**/test/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**"
  target: [nsis, portable]
  icon: build/icon.png
  extraResources:
    - from: native/windows/whisperbrain-uia.ps1
      to: bin/whisperbrain-uia.ps1
    - from: build/loopback/whisperbrain-loopback.exe
      to: bin/whisperbrain-loopback.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # GitHub turns spaces in asset names into dots; latest.yml must name the file as it will be stored or the update download 404s
  artifactName: WhisperBrain-Setup-${version}.${ext}
portable:
  artifactName: WhisperBrain-Portable-${version}.${ext}
# Where the app looks for new versions (electron-updater) and what latest*.yml points at. The release workflow uploads the files
# itself (--publish never), so this only describes the place.
publish:
  provider: github
  owner: nevespvasco
  repo: WhisperBrain
  releaseType: release
