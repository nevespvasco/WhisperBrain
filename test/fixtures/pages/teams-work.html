<!-- a simulated Teams (work or school, teams.microsoft.com) call: tiles, the People panel (with someone whose tile is not shown), live captions -->
<div data-tid="calling-screen">
  <div data-tid="video-tile"><div data-tid="self-view"></div><span data-tid="display-name">Vasco Neves (You)</span></div>
  <div data-tid="video-tile"><span data-tid="display-name">Ana Silva</span><div data-tid="speaking-indicator"></div></div>
  <div data-tid="video-tile"><span data-tid="display-name">Bruno Costa</span></div>
  <div data-tid="roster-list">
    <div role="treeitem" aria-label="Vasco Neves (You)"></div>
    <div role="treeitem" aria-label="Ana Silva"></div>
    <div role="treeitem" aria-label="Bruno Costa"></div>
    <div role="treeitem" aria-label="Carla Dias"></div>
  </div>
  <div data-tid="closed-caption-renderer-wrapper">
    <div data-tid="closed-caption-message"><span data-tid="author">Ana Silva</span><span data-tid="closed-caption-text">shall we begin the meeting</span></div>
  </div>
  <button data-tid="hangup-button">Leave</button>
</div>
