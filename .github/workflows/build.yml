name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      # Ubuntu 24.04 blocks unprivileged user namespaces, which Chromium-based browsers need to start (the live browser tests)
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: sudo apt-get update && sudo apt-get install -y xvfb libx11-dev libxi-dev libxtst-dev libatspi2.0-dev at-spi2-core dbus-x11
      - run: npm ci
      - run: npm run build:x11
      - run: npm run build:atspi
      # Hardware/model integration tests skip themselves when PipeWire or a speech model is absent.
      - run: node scripts/fetch-models.js parakeet-tdt-110m-en
      # The live browser tests need a browser that can load an extension from the command line and expose its tree to AT-SPI.
      # Google's branded Chrome stopped loading --load-extension (version 137); Chrome for Testing is the build made for automation.
      - name: Chrome for Testing (for the live browser tests)
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/cft"
          BIN="$(find "$RUNNER_TEMP/cft" -name chrome -type f | head -1)"
          echo "browser: $BIN"; "$BIN" --version
          echo "WB_BROWSER_BIN=$BIN" >> "$GITHUB_ENV"
      - run: npm test

  # The meeting assistant is plain JavaScript and must behave the same on a Mac: its tests run there too (no audio, no AI server needed).
  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node --test --test-concurrency=1 test/assistant-*.test.js test/briefings.test.js test/llm-scheduler.test.js test/eval-assistant.test.js test/float.test.js test/llm.test.js

  # The helpers that read a browser's Meet window cannot be built or run on the Linux machine the tests run on:
  # compile (macOS) and load (Windows) them here, so a mistake shows up early. It runs beside the installers and does not
  # hold them back (the macOS installer job builds the helper too, so a mistake there still shows up in that job).
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, run: npm run build:ax && npm run build:tap }
          - { os: windows-latest, run: 'powershell -NoProfile -ExecutionPolicy Bypass -File native/windows/whisperbrain-uia.ps1 -Mode selftest' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: ${{ matrix.run }}
      - if: runner.os == 'macOS'
        run: ./build/ax/whisperbrain-ax windows | head -c 400
      # The capture helpers cannot hear a call on a CI machine (no audio device, no permission), so what is checked here is what
      # does not need one: that they build, that the conversion to 16 kHz mono s16 gives the right samples and pitch (selftest),
      # that they say what they can do (probe), and that asking for a process that does not exist is refused cleanly (exit 2).
      - if: runner.os == 'macOS'
        run: |
          ./build/tap/whisperbrain-tap selftest
          ./build/tap/whisperbrain-tap probe
          ./build/tap/whisperbrain-tap system --pid 999999 || test $? -eq 2
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-loopback.ps1
          ./build/loopback/whisperbrain-loopback.exe selftest; if ($LASTEXITCODE -ne 0) { throw 'selftest failed' }
          ./build/loopback/whisperbrain-loopback.exe probe
          # the helper must refuse a process that does not exist with exit 2: that is checked here, so a native exit code must not fail the step by itself
          $PSNativeCommandUseErrorActionPreference = $false
          ./build/loopback/whisperbrain-loopback.exe system --pid 999999
          $code = $LASTEXITCODE
          if ($code -ne 2) { throw "expected exit 2, got $code" }
          exit 0

  dist:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, script: dist:linux, artifact: linux }
          - { os: macos-15, script: dist:mac, artifact: macos-arm64 }
          - { os: macos-15-intel, script: dist:mac, artifact: macos-x64 }
          - { os: windows-latest, script: dist:win, artifact: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxtst-dev libatspi2.0-dev
      - run: npm ci
      # Each OS builds its own installer so npm installs the matching sherpa-onnx native package.
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds; set signing secrets to enable
      # The built app must start, serve its UI (meeting assistant included) and open the floating window: WB_SMOKE=1 does that and exits
      - if: runner.os == 'macOS'
        run: |
          APP="$(find dist -maxdepth 2 -name 'WhisperBrain.app' | head -1)"
          WB_SMOKE=1 WB_USER_DATA="$RUNNER_TEMP/wb-smoke" "$APP/Contents/MacOS/WhisperBrain" | tee smoke.log
          grep -q SMOKE_OK smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: whisperbrain-${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*.exe
