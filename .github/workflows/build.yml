name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      ref: { description: 'Commit, branch or tag to test (empty: the branch picked above)', type: string, required: false, default: '' }
      tests_only: { description: 'Run the tests only, not the native helpers and installers', type: boolean, required: false, default: false }
  # The release workflow runs these tests on the tagged commit before it builds anything (tests_only skips the builds here).
  workflow_call:
    inputs:
      ref: { description: 'Commit, branch or tag to test (empty: the one that triggered the run)', type: string, required: false, default: '' }
      tests_only: { description: 'Run the tests only, not the native helpers and installers', type: boolean, required: false, default: false }

# Read-only token everywhere: nothing here publishes. Third-party actions are pinned by commit (Dependabot proposes updates).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.ref }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      # Ubuntu 24.04 blocks unprivileged user namespaces, which Chromium-based browsers need to start (the live browser tests)
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: sudo apt-get update && sudo apt-get install -y xvfb libx11-dev libxi-dev libxtst-dev libatspi2.0-dev at-spi2-core dbus-x11
      - run: npm ci
      - run: npm run build:x11
      - run: npm run build:atspi
      # Minimal static check (undefined names fail, unused variables warn): pinned ESLint through npx, no devDependency.
      - run: npm run lint
      # Speech and speaker models, kept between runs. The key follows the catalog (URLs and pinned SHA-256 in src/asr/models.js):
      # a changed model downloads again. Bump the -v suffix when the list fetched below changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: models-${{ runner.os }}-${{ hashFiles('src/asr/models.js') }}-v1
      # Hardware/model integration tests skip themselves when PipeWire or a speech model is absent. parakeet-tdt-0.6b-v3 carries the
      # sample voices (test_wavs) the speaker tests play: with it the owned diarization, overlap, real-voice speaker and import tests
      # run here instead of skipping (about 1 min on a 32-core machine). The voice (CAM++) and segmentation models come with them.
      - run: node scripts/fetch-models.js parakeet-tdt-110m-en parakeet-tdt-0.6b-v3
      # The live browser tests need a browser that can load an extension from the command line and expose its tree to AT-SPI.
      # Google's branded Chrome stopped loading --load-extension (version 137); Chrome for Testing is the build made for automation.
      # Pinned (tool and browser), so a new Chrome cannot break CI unannounced. Dependabot does not see these two numbers: bump them
      # by hand (googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json).
      - name: Chrome for Testing (for the live browser tests)
        run: |
          npx --yes @puppeteer/browsers@3.3.0 install chrome@158.0.8127.88 --path "$RUNNER_TEMP/cft"
          BIN="$(find "$RUNNER_TEMP/cft" -name chrome -type f | head -1)"
          echo "browser: $BIN"; "$BIN" --version
          echo "WB_BROWSER_BIN=$BIN" >> "$GITHUB_ENV"
      - run: npm test

  # The meeting assistant is plain JavaScript and must behave the same on a Mac: its tests run there too (no audio, no AI server needed).
  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.ref }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node --test --test-concurrency=1 test/assistant-*.test.js test/briefings.test.js test/llm-scheduler.test.js test/eval-assistant.test.js test/float.test.js test/llm.test.js

  # The helpers that read a browser's Meet window cannot be built or run on the Linux machine the tests run on:
  # compile (macOS) and load (Windows) them here, so a mistake shows up early. It runs beside the installers and does not
  # hold them back (the macOS installer job builds the helper too, so a mistake there still shows up in that job).
  native:
    if: ${{ !inputs.tests_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, run: npm run build:ax && npm run build:tap }
          - { os: windows-latest, run: 'powershell -NoProfile -ExecutionPolicy Bypass -File native/windows/whisperbrain-uia.ps1 -Mode selftest' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.ref }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: ${{ matrix.run }}
      - if: runner.os == 'macOS'
        run: ./build/ax/whisperbrain-ax windows | head -c 400
      # The capture helpers cannot hear a call on a CI machine (no audio device, no permission), so what is checked here is what
      # does not need one: that they build, that the conversion to 16 kHz mono s16 gives the right samples and pitch (selftest),
      # that they say what they can do (probe), and that asking for a process that does not exist is refused cleanly (exit 2).
      - if: runner.os == 'macOS'
        run: |
          ./build/tap/whisperbrain-tap selftest
          ./build/tap/whisperbrain-tap probe
          ./build/tap/whisperbrain-tap system --pid 999999 || test $? -eq 2
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-loopback.ps1
          ./build/loopback/whisperbrain-loopback.exe selftest; if ($LASTEXITCODE -ne 0) { throw 'selftest failed' }
          ./build/loopback/whisperbrain-loopback.exe probe
          # the helper must refuse a process that does not exist with exit 2: that is checked here, so a native exit code must not fail the step by itself
          $PSNativeCommandUseErrorActionPreference = $false
          ./build/loopback/whisperbrain-loopback.exe system --pid 999999
          $code = $LASTEXITCODE
          if ($code -ne 2) { throw "expected exit 2, got $code" }
          exit 0

  dist:
    if: ${{ !inputs.tests_only }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, script: dist:linux, artifact: linux }
          - { os: macos-15, script: dist:mac, artifact: macos-arm64 }
          - { os: macos-15-intel, script: dist:mac, artifact: macos-x64 }
          - { os: windows-latest, script: dist:win, artifact: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.ref }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxtst-dev libatspi2.0-dev xvfb
      - run: npm ci
      # Each OS builds its own installer so npm installs the matching sherpa-onnx native package.
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds; set signing secrets to enable
      # A small speech model for the smoke test below: with WB_SMOKE_MODELS the packaged app also starts its speech worker
      # (ELECTRON_RUN_AS_NODE from inside app.asar, with the Electron fuses flipped) and transcribes a sample. Not on Windows yet.
      - if: runner.os != 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: models-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/asr/models.js') }}-v1
      - if: runner.os != 'Windows'
        run: node scripts/fetch-models.js parakeet-tdt-110m-en
      # The built app must start, serve its UI (meeting assistant included) and open the floating window: WB_SMOKE=1 does that and exits.
      # The sample is passed in: the packaged app does not carry test/.
      - if: runner.os == 'Linux'
        run: WB_SMOKE=1 WB_SMOKE_MODELS="$PWD/.models" WB_SMOKE_WAV="$PWD/test/fixtures/hello.wav" WB_USER_DATA="$RUNNER_TEMP/wb-smoke" xvfb-run -a dist/linux-unpacked/whisperbrain --no-sandbox --disable-gpu | tee smoke.log && grep -q SMOKE_OK smoke.log
      - if: runner.os == 'macOS'
        run: |
          APP="$(find dist -maxdepth 2 -name 'WhisperBrain.app' | head -1)"
          WB_SMOKE=1 WB_SMOKE_MODELS="$PWD/.models" WB_SMOKE_WAV="$PWD/test/fixtures/hello.wav" WB_USER_DATA="$RUNNER_TEMP/wb-smoke" "$APP/Contents/MacOS/WhisperBrain" | tee smoke.log
          grep -q SMOKE_OK smoke.log
      # Windows: a GUI program's console output does not reach the step, so the result is read from the app's own log.
      - if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:WB_SMOKE = '1'; $env:WB_USER_DATA = "$env:RUNNER_TEMP\wb-smoke"
          Start-Process -FilePath 'dist\win-unpacked\WhisperBrain.exe' -ArgumentList '--disable-gpu' -Wait
          $log = Get-Content "$env:WB_USER_DATA\logs\app.log" -Raw
          $log
          if ($log -notmatch 'SMOKE_OK') { throw 'smoke test failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whisperbrain-${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*.exe
