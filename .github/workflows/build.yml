name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libx11-dev libxi-dev libxtst-dev
      - run: npm ci
      - run: npm run build:x11
      # Hardware/model integration tests skip themselves when PipeWire or a speech model is absent.
      - run: node scripts/fetch-models.js parakeet-tdt-110m-en
      - run: npm test

  dist:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, script: dist:linux, artifact: linux }
          - { os: macos-14, script: dist:mac, artifact: macos-arm64 }
          - { os: macos-13, script: dist:mac, artifact: macos-x64 }
          - { os: windows-latest, script: dist:win, artifact: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxtst-dev
      - run: npm ci
      # Each OS builds its own installer so npm installs the matching sherpa-onnx native package.
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds; set signing secrets to enable
      - uses: actions/upload-artifact@v4
        with:
          name: whisperbrain-${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*.exe
